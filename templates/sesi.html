{% extends "base.html" %}
{% block title %}Sesi & Presensi — BimbelKu{% endblock %}
{% block content %}
<h1>Sesi & Presensi</h1>
<div class="card row">
  <label>Tanggal: <input type="date" id="tgl"></label>
  <button id="lihat">Lihat</button>
</div>
<table id="tbl"><thead><tr>
  <th>Jam</th><th>Mapel</th><th>Tutor</th><th>Siswa</th><th>Status</th><th>Materi</th><th></th>
</tr></thead><tbody></tbody></table>

<div id="modal" class="modal hidden"><div class="modal-box">
  <h3 id="p-judul"></h3>
  <div class="row" style="justify-content:center">
    <button data-st="hadir">Hadir</button>
    <button data-st="tidak_hadir" class="ghost">Tidak hadir</button>
    <button data-st="batal" class="ghost">Batal</button>
  </div>
  <input id="p-materi" placeholder="Materi yang dibahas" style="width:100%;margin-top:8px">
  <input id="p-catatan" placeholder="Catatan perkembangan" style="width:100%;margin-top:8px">
  <div style="margin-top:8px"><button id="p-tutup" class="ghost">Tutup</button></div>
</div></div>
{% endblock %}
{% block script %}<script src="{{ url_for('static', filename='js/sesi.js') }}"></script>{% endblock %}
